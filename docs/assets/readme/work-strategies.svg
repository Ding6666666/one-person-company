<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">One Person Company work strategies</title>
  <desc id="desc">Direct, Star, Graph, and Battle collaboration patterns</desc>
  <defs>
